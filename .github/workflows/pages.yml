# Test preview on GitHub Pages: https://<user>.github.io/<repo>/
# Builds with the repo name as path prefix and noindex, without PHP and .htaccess (Pages can run neither).
# The real website is still uploaded from site/ to Hostnet; never use this build there.
name: Test preview (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build test version
        run: BASE=/${{ github.event.repository.name }} NOINDEX=1 python3 tools/build.py
      - name: Remove server-only files, block search engines
        run: |
          rm -f site/.htaccess site/kontakt-senden.php site/sitemap.xml
          printf 'User-agent: *\nDisallow: /\n' > site/robots.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
